[workspace]
members = ["src-tauri", "apis", "crates/protocol"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Release settings belong at the workspace root, not to a single member.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
