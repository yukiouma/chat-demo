[package]
name = "crf-protocol"
version = "0.1.0"
edition = "2024"

[lib]
name = "protocol"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "11", features = ["uuid-impl", "chrono-impl", "serde-json-impl"] }
